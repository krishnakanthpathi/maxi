<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxi HUD ⚡</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.75);
      --card-border: rgba(63, 63, 70, 0.4);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --pulse-color: #ec4899;
      --success: #34d399;
      --tool-bg: rgba(39, 39, 42, 0.8);
      --tool-border: rgba(82, 82, 91, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.08), transparent 35%);
    }

    /* Header */
    header {
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.7);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-pill {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #09090b;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 140px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Siri-style Voice Orb */
    .orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #a855f7 60%, #ec4899);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.6);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 14px;
      cursor: pointer;
    }

    .orb.listening {
      transform: scale(1.22);
      box-shadow: 0 0 50px rgba(236, 72, 153, 0.8), 0 0 80px rgba(56, 189, 248, 0.5);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1.15); filter: hue-rotate(0deg); }
      100% { transform: scale(1.3); filter: hue-rotate(45deg); }
    }

    .orb-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .orb-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Feed & Message Cards */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .turn-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .turn-card:hover {
      border-color: rgba(113, 113, 122, 0.6);
    }

    .turn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .turn-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .turn-badge.voice {
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .turn-badge.text {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .prompt-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
    }

    .response-box {
      background: rgba(9, 9, 11, 0.6);
      border: 1px solid rgba(39, 39, 42, 0.8);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e4e4e7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tools-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tool-tag {
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .preset-pill {
      background: rgba(39, 39, 42, 0.8);
      border: 1px solid var(--tool-border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-pill:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    /* Fixed Bottom Input Bar */
    .input-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 20px;
      background: linear-gradient(to top, rgba(9, 9, 11, 0.95) 75%, transparent);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      z-index: 40;
    }

    .input-form {
      max-width: 900px;
      width: 100%;
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 10px 8px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .input-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .input-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.98rem;
    }

    .input-form input::placeholder {
      color: #71717a;
    }

    .send-btn {
      background: var(--accent);
      color: #09090b;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .send-btn:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .send-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ Maxi HUD</span>
      <span class="brand-pill">Live</span>
    </div>
    <div class="status-group">
      <div class="status-badge" style="gap: 8px;">
        <span style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Sound:</span>
        <select id="sound-theme-select" style="background: transparent; color: var(--text); border: none; font-size: 0.82rem; outline: none; cursor: pointer;">
          <option value="minimal" style="background: #18181b;">Minimal (Linear)</option>
          <option value="glass" style="background: #18181b;">Glass (Crystal)</option>
          <option value="soft" style="background: #18181b;">Soft (Chime)</option>
          <option value="scifi" style="background: #18181b;">Sci-Fi (Jarvis)</option>
          <option value="zen" style="background: #18181b;">Zen (Bowl)</option>
          <option value="synth" style="background: #18181b;">Synth (Harmonic)</option>
        </select>
        <button id="test-start-btn" title="Audition Start Sound" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: var(--accent); padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: 600; cursor: pointer;">▶ Start</button>
        <button id="test-release-btn" title="Audition Release / Send Sound" style="background: rgba(236, 72, 153, 0.15); border: 1px solid rgba(236, 72, 153, 0.4); color: #ec4899; padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: 600; cursor: pointer;">▶ Release</button>
        <button id="test-result-btn" title="Audition Result Sound" style="background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.4); color: var(--success); padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: 600; cursor: pointer;">▶ Result</button>
      </div>
      <div class="status-badge" style="gap: 6px;" title="Auto-detect end of speech (800ms silence) and trigger immediately">
        <input type="checkbox" id="vad-checkbox" checked style="cursor: pointer; accent-color: var(--accent);">
        <label for="vad-checkbox" style="font-size: 0.75rem; cursor: pointer; user-select: none;">Auto-Send</label>
      </div>
      <div class="status-badge">
        <span class="dot" id="ws-dot"></span>
        <span id="ws-status">Connecting...</span>
      </div>
      <div class="status-badge">
        <span>Port 4848</span>
      </div>
      <button id="open-config-btn" class="status-badge" style="cursor: pointer; font-weight: 600; color: var(--accent); background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3);">
        ⚙️ Config
      </button>
    </div>
  </header>

  <!-- Provider Configuration Modal -->
  <div id="config-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #18181b; border: 1px solid var(--card-border); border-radius: 16px; max-width: 580px; width: 100%; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(63, 63, 70, 0.4); padding-bottom: 12px;">
        <h3 style="font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px;">⚡ Provider Configuration</h3>
        <button id="close-config-btn" style="background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 4px 8px;">✕</button>
      </div>

      <!-- LLM Section -->
      <div style="margin-bottom: 20px;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">🧠 LLM Provider</label>
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
          <button type="button" class="preset-pill" onclick="selectLlmPreset('ollama')">Ollama (Local Default)</button>
          <button type="button" class="preset-pill" onclick="selectLlmPreset('jamba')">AI21 Jamba (Cloud Default)</button>
          <button type="button" class="preset-pill" onclick="selectLlmPreset('groq')">Groq (Cloud)</button>
          <button type="button" class="preset-pill" onclick="selectLlmPreset('openrouter')">OpenRouter</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">Endpoint URL</label>
            <input type="text" id="cfg-llm-url" placeholder="http://localhost:11434/v1" style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">Model Identifier</label>
            <input type="text" id="cfg-llm-model" placeholder="llama3.2 or jamba-1.5-mini" style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">API Key (leave 'ollama' or empty for local)</label>
            <input type="password" id="cfg-llm-key" placeholder="ollama or sk-..." style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
        </div>
      </div>

      <!-- Voice STT Section -->
      <div style="margin-bottom: 24px; border-top: 1px solid rgba(63, 63, 70, 0.4); padding-top: 16px;">
        <label style="font-size: 0.85rem; font-weight: 700; color: #ec4899; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">🎙️ Voice STT Provider</label>
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
          <button type="button" class="preset-pill" onclick="selectVoicePreset('groq-whisper')">Groq Whisper (Cloud Default)</button>
          <button type="button" class="preset-pill" onclick="selectVoicePreset('local-whisper')">Local Whisper</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">Voice Endpoint URL</label>
            <input type="text" id="cfg-voice-url" placeholder="https://api.groq.com/openai/v1" style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">Voice Model</label>
            <input type="text" id="cfg-voice-model" placeholder="whisper-large-v3-turbo" style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
          <div>
            <label style="font-size: 0.78rem; color: var(--text-muted);">Voice API Key</label>
            <input type="password" id="cfg-voice-key" placeholder="gsk_..." style="width: 100%; background: #09090b; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 4px;">
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(63, 63, 70, 0.4); padding-top: 16px;">
        <button id="cancel-config-btn" style="background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">Cancel</button>
        <button id="save-config-btn" style="background: var(--accent); border: none; color: #09090b; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem;">Save & Hot-Reload</button>
      </div>
    </div>
  </div>


  <main>
    <!-- Siri-style Voice Orb -->
    <div class="orb-container" id="orb-card">
      <div class="orb" id="voice-orb" title="Tap or hold Right Option (Mac) / Control + Space (Win) to speak"></div>
      <div class="orb-label" id="orb-status">Ready for Voice or Text</div>
      <div class="orb-hint">Tap or hold <b>Right Option</b> (Mac) / <b>Control + Space</b> (Win) to speak</div>
    </div>

    <!-- Live Conversation Turns Feed -->
    <div class="feed" id="feed">
      <!-- Cards appended dynamically -->
    </div>
  </main>

  <!-- Input Bar -->
  <div class="input-bar-container">
    <form class="input-form" id="input-form">
      <input type="text" id="prompt-input" placeholder="Ask Maxi anything or press Right Option / Control + Space..." autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const inputForm = document.getElementById('input-form');
    const promptInput = document.getElementById('prompt-input');
    const voiceOrb = document.getElementById('voice-orb');
    const orbStatus = document.getElementById('orb-status');
    const wsDot = document.getElementById('ws-dot');
    const wsStatus = document.getElementById('ws-status');

    let ws = null;
    let activeStreamCard = null;

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        wsDot.classList.remove('disconnected');
        wsStatus.textContent = 'Daemon Live';
      };

      ws.onclose = () => {
        wsDot.classList.add('disconnected');
        wsStatus.textContent = 'Reconnecting...';
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = (err) => {
        wsDot.classList.add('disconnected');
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWebSocketMessage(msg);
        } catch (e) {
          console.error("Failed to parse WS message:", event.data);
        }
      };
    }

    function handleWebSocketMessage(msg) {
      if (msg.event === 'voice_start') {
        voiceOrb.classList.add('listening');
        orbStatus.textContent = 'Listening to speech...';
      } else if (msg.event === 'voice_interim_transcript') {
        voiceOrb.classList.add('listening');
        orbStatus.innerHTML = `🗣️ <i>"${escapeHtml(msg.transcript)}"</i>`;
      } else if (msg.event === 'voice_locked') {
        voiceOrb.classList.add('listening');
        orbStatus.textContent = '🔒 Recording locked in (tap hotkey again to finish)...';
      } else if (msg.event === 'voice_stop') {
        voiceOrb.classList.remove('listening');
        orbStatus.textContent = 'Processing request...';
      } else if (msg.event === 'voice_result') {
        voiceOrb.classList.remove('listening');
        orbStatus.textContent = 'Ready for Voice or Text';
        addTurnCard({
          source: 'voice',
          prompt: msg.transcript,
          output: msg.output,
          tools: msg.tools || []
        });
      } else if (msg.event === 'chunk' && activeStreamCard) {
        const resBox = activeStreamCard.querySelector('.response-box');
        resBox.textContent += msg.data;
      } else if (msg.event === 'done') {
        activeStreamCard = null;
      }
    }

    function addTurnCard({ source, prompt, output, tools = [] }) {
      const card = document.createElement('div');
      card.className = 'turn-card';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const badgeClass = source.startsWith('voice') ? 'voice' : 'text';
      const badgeLabel = source.startsWith('voice') ? '🎙️ Voice' : '💬 Text';

      let toolsHtml = '';
      if (tools && tools.length > 0) {
        toolsHtml = `
          <div class="tools-list">
            ${tools.map(t => `<span class="tool-tag">🔧 ${escapeHtml(t)}</span>`).join('')}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="turn-header">
          <span class="turn-badge ${badgeClass}">${badgeLabel}</span>
          <span>${timeStr}</span>
        </div>
        <div class="prompt-text">${escapeHtml(prompt)}</div>
        <div class="response-box">${escapeHtml(output)}</div>
        ${toolsHtml}
      `;

      feed.prepend(card);
      return card;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Form submission via WebSocket or HTTP fallback
    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = '';

      if (ws && ws.readyState === WebSocket.OPEN) {
        activeStreamCard = addTurnCard({
          source: 'text',
          prompt: text,
          output: '',
          tools: []
        });
        ws.send(JSON.stringify({ text: text, source: 'text' }));
      } else {
        // Fallback to HTTP
        try {
          const resp = await fetch('/api/prompt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, source: 'text' })
          });
          const res = await resp.json();
          addTurnCard({
            source: 'text',
            prompt: text,
            output: res.output,
            tools: res.tools_used || []
          });
        } catch (err) {
          addTurnCard({
            source: 'text',
            prompt: text,
            output: `Error: ${err.message}`,
            tools: []
          });
        }
      }
    });

    // Initial load: Fetch audit history
    async function loadHistory() {
      try {
        const resp = await fetch('/api/history?limit=10');
        if (resp.ok) {
          const data = await resp.json();
          if (data.history && data.history.length > 0) {
            data.history.forEach(item => {
              addTurnCard({
                source: item.source || 'text',
                prompt: item.prompt,
                output: item.output,
                tools: item.tools_used || []
              });
            });
          }
        }
      } catch (err) {
        console.warn("Could not load history:", err);
      }
    }

    // Sound theme controls
    const soundThemeSelect = document.getElementById('sound-theme-select');
    const testStartBtn = document.getElementById('test-start-btn');
    const testReleaseBtn = document.getElementById('test-release-btn');
    const testResultBtn = document.getElementById('test-result-btn');
    const vadCheckbox = document.getElementById('vad-checkbox');

    const soundThemes = {
      minimal: { start: 'minimal_wake', release: 'minimal_notification', finish: 'minimal_complete' },
      glass: { start: 'glass_wake', release: 'glass_notification', finish: 'glass_complete' },
      soft: { start: 'soft_wake', release: 'soft_notification', finish: 'soft_complete' },
      scifi: { start: 'scifi_wake', release: 'scifi_notification', finish: 'scifi_complete' },
      zen: { start: 'zen_wake', release: 'zen_notification', finish: 'zen_complete' },
      synth: { start: 'bloom', release: 'minimal_notification', finish: 'chime' }
    };

    async function initSoundControls() {
      try {
        const resp = await fetch('/api/sounds');
        if (resp.ok) {
          const data = await resp.json();
          const activeStart = data.active?.start_sound || '';
          if (data.active?.auto_endpoint !== undefined) {
            vadCheckbox.checked = !!data.active.auto_endpoint;
          }
          for (const [theme, cfg] of Object.entries(soundThemes)) {
            if (activeStart.includes(cfg.start) || cfg.start === activeStart) {
              soundThemeSelect.value = theme;
              break;
            }
          }
        }
      } catch (e) {
        console.warn("Could not load sound settings:", e);
      }

      soundThemeSelect.addEventListener('change', async () => {
        const selected = soundThemeSelect.value;
        const cfg = soundThemes[selected];
        if (!cfg) return;

        try {
          await fetch('/api/sounds/set', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_sound: cfg.start, release_sound: cfg.release, finish_sound: cfg.finish })
          });
          // Audition the finish chime on theme change
          await fetch('/api/sounds/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sound: cfg.finish })
          });
        } catch (err) {
          console.error("Failed to set sound theme:", err);
        }
      });

      testStartBtn.addEventListener('click', async () => {
        const selected = soundThemeSelect.value;
        const cfg = soundThemes[selected];
        if (cfg) {
          await fetch('/api/sounds/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sound: cfg.start })
          });
        }
      });

      testReleaseBtn.addEventListener('click', async () => {
        const selected = soundThemeSelect.value;
        const cfg = soundThemes[selected];
        if (cfg) {
          await fetch('/api/sounds/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sound: cfg.release })
          });
        }
      });

      testResultBtn.addEventListener('click', async () => {
        const selected = soundThemeSelect.value;
        const cfg = soundThemes[selected];
        if (cfg) {
          await fetch('/api/sounds/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sound: cfg.finish })
          });
        }
      });

      vadCheckbox.addEventListener('change', async () => {
        try {
          await fetch('/api/sounds/set', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ auto_endpoint: vadCheckbox.checked })
          });
        } catch (err) {
          console.error("Failed to toggle auto-endpoint:", err);
        }
      });
    }

    // Config Modal Controls
    const configModal = document.getElementById('config-modal');
    const openConfigBtn = document.getElementById('open-config-btn');
    const closeConfigBtn = document.getElementById('close-config-btn');
    const cancelConfigBtn = document.getElementById('cancel-config-btn');
    const saveConfigBtn = document.getElementById('save-config-btn');

    const cfgLlmUrl = document.getElementById('cfg-llm-url');
    const cfgLlmModel = document.getElementById('cfg-llm-model');
    const cfgLlmKey = document.getElementById('cfg-llm-key');
    const cfgVoiceUrl = document.getElementById('cfg-voice-url');
    const cfgVoiceModel = document.getElementById('cfg-voice-model');
    const cfgVoiceKey = document.getElementById('cfg-voice-key');

    window.selectLlmPreset = function(preset) {
      if (preset === 'ollama') {
        cfgLlmUrl.value = 'http://localhost:11434/v1';
        cfgLlmModel.value = 'llama3.2';
        cfgLlmKey.value = 'ollama';
      } else if (preset === 'jamba') {
        cfgLlmUrl.value = 'https://api.ai21.com/studio/v1';
        cfgLlmModel.value = 'jamba-1.5-mini';
        if (cfgLlmKey.value === 'ollama') cfgLlmKey.value = '';
      } else if (preset === 'groq') {
        cfgLlmUrl.value = 'https://api.groq.com/openai/v1';
        cfgLlmModel.value = 'llama-3.3-70b-versatile';
        if (cfgLlmKey.value === 'ollama') cfgLlmKey.value = '';
      } else if (preset === 'openrouter') {
        cfgLlmUrl.value = 'https://openrouter.ai/api/v1';
        cfgLlmModel.value = 'ai21/jamba-1.5-mini';
        if (cfgLlmKey.value === 'ollama') cfgLlmKey.value = '';
      }
    };

    window.selectVoicePreset = function(preset) {
      if (preset === 'groq-whisper') {
        cfgVoiceUrl.value = 'https://api.groq.com/openai/v1';
        cfgVoiceModel.value = 'whisper-large-v3-turbo';
      } else if (preset === 'local-whisper') {
        cfgVoiceUrl.value = 'http://localhost:8000/v1';
        cfgVoiceModel.value = 'whisper-1';
        cfgVoiceKey.value = 'local-key';
      }
    };

    async function loadConfigModal() {
      try {
        const resp = await fetch('/api/config');
        if (resp.ok) {
          const data = await resp.json();
          const c = data.config || {};
          cfgLlmUrl.value = c.llm_url || '';
          cfgLlmModel.value = c.llm_model || '';
          cfgLlmKey.value = c.llm_key || '';
          cfgVoiceUrl.value = c.voice_url || '';
          cfgVoiceModel.value = c.voice_model || '';
          cfgVoiceKey.value = c.voice_key || '';
        }
      } catch (err) {
        console.warn("Could not load config:", err);
      }
    }

    openConfigBtn.addEventListener('click', () => {
      loadConfigModal();
      configModal.style.display = 'flex';
    });

    closeConfigBtn.addEventListener('click', () => { configModal.style.display = 'none'; });
    cancelConfigBtn.addEventListener('click', () => { configModal.style.display = 'none'; });

    saveConfigBtn.addEventListener('click', async () => {
      saveConfigBtn.disabled = true;
      saveConfigBtn.innerText = 'Saving...';
      const updates = {
        OPENAI_BASE_URL: cfgLlmUrl.value.trim(),
        OPENAI_MODEL: cfgLlmModel.value.trim(),
        OPENAI_API_KEY: cfgLlmKey.value.trim(),
        VOICE_BASE_URL: cfgVoiceUrl.value.trim(),
        VOICE_MODEL: cfgVoiceModel.value.trim(),
        VOICE_API_KEY: cfgVoiceKey.value.trim(),
      };

      try {
        const resp = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates)
        });
        if (resp.ok) {
          configModal.style.display = 'none';
        }
      } catch (e) {
        alert("Failed to save config: " + e.message);
      } finally {
        saveConfigBtn.disabled = false;
        saveConfigBtn.innerText = 'Save & Hot-Reload';
      }
    });

    connectWebSocket();
    loadHistory();
    initSoundControls();
  </script>
</body>
</html>
