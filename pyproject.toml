[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxi-ai"
dynamic = ["version"]
description = "Voice-controlled desktop assistant with a native macOS HUD and MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Maxi Team" }
]
keywords = [
    "ai",
    "agent",
    "voice",
    "mcp",
    "streaming",
    "daemon",
    "workstation",
    "macos",
    "linux",
    "assistant"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.3.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.5.0",
    "pynput>=1.8.0",
    "numpy>=2.0.0",
]
all = [
    "sounddevice>=0.5.0",
    "pynput>=1.8.0",
    "numpy>=2.0.0",
]

[project.scripts]
maxi = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.sources]
"app/sounds" = "app/sounds"

[tool.hatch.version]
path = "app/__init__.py"

# maxi hud builds these sources after a wheel install, including on a fresh Mac.
[tool.hatch.build.targets.wheel.force-include]
"frontends/macos/Package.swift" = "frontends/macos/Package.swift"
"frontends/macos/Sources" = "frontends/macos/Sources"

[tool.hatch.build.targets.sdist]
include = ["/app", "/frontends/macos/Package.swift", "/frontends/macos/Sources", "/scripts", "/tests", "/assets", "/README.md", "/CHANGELOG.md", "/LICENSE", "/.env.example", "/pyproject.toml", "/requirements.txt", "/docs", "/releases", "/.maxi/mcp_config.example.json", "/.maxi/skills"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]
